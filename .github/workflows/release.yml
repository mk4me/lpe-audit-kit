name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build tarball
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          STAGE="lpe-audit-kit-${VERSION}"
          mkdir -p "${STAGE}"
          cp lpe-audit.sh fleet-audit.sh verify.sh hosts.txt.example \
             README.md LICENSE NOTICE CHANGELOG.md SECURITY.md \
             "${STAGE}/"
          # Generate fresh checksums
          (cd "${STAGE}" && sha256sum lpe-audit.sh fleet-audit.sh verify.sh README.md hosts.txt.example > SHA256SUMS)
          tar czf "${STAGE}.tar.gz" "${STAGE}/"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          ls -la

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lpe-audit-kit-${{ steps.version.outputs.VERSION }}.tar.gz
            lpe-audit-kit-${{ steps.version.outputs.VERSION }}.tar.gz.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
